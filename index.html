<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whack-a-Dot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <h1>Whack-a-Dot</h1>

    <section class="hud" aria-live="polite">
      <div class="stat">
        <span class="label">Hits</span>
        <span id="hits" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">Misses</span>
        <span id="misses" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">Score</span>
        <span id="score" class="value">0</span>
      </div>
      <div class="stat">
        <span class="label">Time Left</span>
        <span id="timeLeft" class="value">10.0s</span>
      </div>
    </section>

    <section class="status-controls">
      <p id="status" class="status">Press Start to begin.</p>

      <section class="controls">
        <button id="startBtn" type="button">Start Game</button>
        <button id="resetBtn" type="button">Reset</button>
      </section>
    </section>

    <section id="board" class="board" aria-label="Whack-a-dot game board"></section>
  </main>

  <script src="script.js?v=20260320"></script>
</body>
</html>
